name: Deploy staging to Railway
on:
  workflow_call:
    secrets:
      RAILWAY_TOKEN:
        required: true
      OPS_READ_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: crm-railway-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/staging' &&
      vars.CRM_APP_READY == 'true' && vars.CRM_STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/prepare-deployment.mjs staging
      - name: Validate deployment configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          OPS_READ_TOKEN: ${{ secrets.OPS_READ_TOKEN }}
          CRM_BASE_URL: ${{ vars.STAGING_CRM_BASE_URL }}
        run: node scripts/check-deploy-config.mjs
      - name: Install pinned Railway CLI
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("infra/railway/services.json", "utf8")).railwayCliVersion')
          npm install --global "@railway/cli@$version"
      - name: Deploy this commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/deploy-railway.mjs
      - name: Confirm running release
        env:
          CRM_BASE_URL: ${{ vars.STAGING_CRM_BASE_URL }}
          OPS_READ_TOKEN: ${{ secrets.OPS_READ_TOKEN }}
        run: node scripts/release-check.mjs
